name: flutter_duskmoon_ui_workspace
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

workspace:
  - packages/duskmoon_theme
  - packages/duskmoon_theme_bloc
  - packages/duskmoon_widgets
  - packages/duskmoon_settings
  - packages/duskmoon_feedback
  - packages/duskmoon_visualization
  - packages/duskmoon_ui
  - packages/duskmoon_form
  - packages/duskmoon_code_engine
  - packages/duskmoon_adaptive_scaffold
  - packages/duskmoon_mermaid_renderer
  - example

flutter:
  uses-material-design: true

dev_dependencies:
  melos: ^8.9.0

melos:
  repository: https://github.com/duskmoon-dev/flutter_duskmoon_ui

  command:
    bootstrap:
      environment:
        sdk: ">=3.5.0 <4.0.0"
        flutter: ">=3.24.0"

  scripts:
    analyze:
      run: melos exec -- dart analyze --fatal-infos
    test:
      run: melos exec -- flutter test
    format:
      run: melos exec -- dart format --set-exit-if-changed .
    codegen:
      description: "Sync generated theme tokens from the sibling design repository"
      run: bun run tool/sync_design_tokens.ts
