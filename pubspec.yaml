name: flutter_duskmoon_ui_workspace
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

workspace:
  - packages/duskmoon_theme
  - packages/duskmoon_theme_bloc
  - packages/duskmoon_widgets
  - packages/duskmoon_settings
  - packages/duskmoon_feedback
  - packages/duskmoon_visualization
  - packages/duskmoon_ui
  - packages/duskmoon_form
  - packages/duskmoon_code_engine
  - packages/duskmoon_adaptive_scaffold
  - packages/duskmoon_mermaid_renderer
  - packages/duskmoon_highlight
  - example/design_preview
  - example/duo_screen

flutter:
  uses-material-design: true

dev_dependencies:
  melos: ^8.9.0

melos:
  repository: https://github.com/duskmoon-dev/flutter_duskmoon_ui

  scripts:
    analyze:
      run: melos exec -- dart analyze --fatal-infos
    test:
      # Flutter native hooks share a workspace build lock.
      run: melos exec --concurrency=1 -- flutter test
    format:
      run: melos exec -- dart format --language-version=3.6 --set-exit-if-changed .
    upgrade:
      description: "Upgrade all dependencies to latest across workspace"
      run: dart pub upgrade --major-versions
    outdated:
      exec:
        command: dart pub outdated
        orderDependents: true
      description: Run `flutter pub outdated` check outdated dependencies in all packages.
    codegen:
      description: "Sync generated theme tokens from the sibling design repository"
      run: bun run tool/sync_design_tokens.ts
