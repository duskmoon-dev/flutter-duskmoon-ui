name: duskmoon_ui
description: DuskMoon UI — umbrella package re-exporting all DuskMoon Flutter packages
version: 2.2.6
homepage: https://github.com/duskmoon-dev/flutter_duskmoon_ui
repository: https://github.com/duskmoon-dev/flutter_duskmoon_ui
issue_tracker: https://github.com/duskmoon-dev/flutter_duskmoon_ui/issues
topics:
  - flutter
  - design-system
  - ui
  - widgets
  - theme

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  duskmoon_theme: ^2.2.6
  duskmoon_theme_bloc: ^2.2.6
  duskmoon_widgets: ^2.2.6
  duskmoon_settings: ^2.2.6
  duskmoon_feedback: ^2.2.6
  duskmoon_visualization: ^2.2.6
  duskmoon_form: ^2.2.6
  duskmoon_code_engine: ^2.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
