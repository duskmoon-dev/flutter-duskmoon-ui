name: duskmoon_widgets
description: Adaptive widget library for DuskMoon Design System
version: 2.2.5
homepage: https://github.com/duskmoon-dev/flutter-duskmoon-ui
repository: https://github.com/duskmoon-dev/flutter-duskmoon-ui
issue_tracker: https://github.com/duskmoon-dev/flutter-duskmoon-ui/issues
topics:
  - flutter
  - widgets
  - adaptive
  - material-design
  - cupertino

resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  duskmoon_theme: ^2.2.5
  duskmoon_code_engine: ^2.2.5
  duskmoon_adaptive_scaffold: ^2.2.5
  duskmoon_mermaid_renderer: ^2.2.5
  duskmoon_highlight: ^2.2.5
  markdown: ^7.3.1
  flutter_svg: ">=2.0.0+1 <3.0.0"
  provider: ^6.0.5
  meta: ^1.8.0
  collection: ^1.17.0
  tuple: ^2.0.1
  url_launcher: ^6.3.3
  fluent_ui: ^4.16.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: KaTeX_Main
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Main-Regular.ttf
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Main-Italic.ttf
          style: italic
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Main-Bold.ttf
          weight: 700
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Main-BoldItalic.ttf
          weight: 700
          style: italic
    - family: KaTeX_Math
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Math-Italic.ttf
          style: italic
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Math-BoldItalic.ttf
          weight: 700
          style: italic
    - family: KaTeX_AMS
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_AMS-Regular.ttf
    - family: KaTeX_Caligraphic
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Caligraphic-Regular.ttf
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Caligraphic-Bold.ttf
          weight: 700
    - family: KaTeX_Fraktur
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Fraktur-Regular.ttf
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Fraktur-Bold.ttf
          weight: 700
    - family: KaTeX_SansSerif
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_SansSerif-Regular.ttf
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_SansSerif-Bold.ttf
          weight: 700
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_SansSerif-Italic.ttf
          style: italic
    - family: KaTeX_Script
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Script-Regular.ttf
    - family: KaTeX_Typewriter
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Typewriter-Regular.ttf
    - family: KaTeX_Size1
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Size1-Regular.ttf
    - family: KaTeX_Size2
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Size2-Regular.ttf
    - family: KaTeX_Size3
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Size3-Regular.ttf
    - family: KaTeX_Size4
      fonts:
        - asset: lib/src/vendor/flutter_math/katex_fonts/fonts/KaTeX_Size4-Regular.ttf
