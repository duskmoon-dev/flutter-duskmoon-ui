name: duskmoon_highlight
description: Tree-sitter parsing and syntax highlighting for Flutter, with bundled native and WebAssembly grammars.
version: 2.2.4
repository: https://github.com/duskmoon-dev/flutter-duskmoon-ui
issue_tracker: https://github.com/duskmoon-dev/flutter-duskmoon-ui/issues
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  code_assets: ^2.1.0
  native_toolchain_c: ^0.19.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/tree-sitter/
    - assets/grammars/
