name: duskmoon_form
description: Form state management and adaptive form widgets for DuskMoon Design System
version: 1.10.1
homepage: https://github.com/duskmoon-dev/flutter_duskmoon_ui
repository: https://github.com/duskmoon-dev/flutter_duskmoon_ui
issue_tracker: https://github.com/duskmoon-dev/flutter_duskmoon_ui/issues
topics:
  - flutter
  - forms
  - bloc
  - adaptive
  - material-design

resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  duskmoon_theme: ^1.10.1
  duskmoon_widgets: ^1.10.1
  fluent_ui: ^4.16.1
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  rxdart: ^0.28.0
  equatable: ^2.1.0
  collection: ^1.19.1
  meta: ^1.19.0
  uuid: ^4.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  duskmoon_code_engine: ^1.10.1

flutter:
  uses-material-design: true
