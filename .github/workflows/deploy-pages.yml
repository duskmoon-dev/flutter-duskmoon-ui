name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          # fluent_ui 4.18 removed the TabView.currentIndex API used by DmTabBar.
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            fluent_ui: 4.17.0
          YAML
          dart pub get

      - name: Build web
        working-directory: example/design_preview
        run: flutter build web --release --base-href "/duskmoon-flutter/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: example/design_preview/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
