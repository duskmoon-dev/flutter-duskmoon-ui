name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.1)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Publish to pub.dev
        run: |
          # Order packages after all their internal dependencies, including dev dependencies.

          ALL_PKGS=()
          for d in packages/*/; do
            [ -f "$d/pubspec.yaml" ] && ALL_PKGS+=("${d%/}")
          done

          # Collect package names for internal-dep detection
          PKG_NAMES=()
          for pkg in "${ALL_PKGS[@]}"; do
            PKG_NAMES+=("$(basename "$pkg")")
          done

          declare -A ORDERED
          PUBLISH_ORDER=()
          while [ "${#PUBLISH_ORDER[@]}" -lt "${#ALL_PKGS[@]}" ]; do
            progress=false
            for pkg in "${ALL_PKGS[@]}"; do
              name=$(basename "$pkg")
              [ "${ORDERED[$name]:-}" = true ] && continue
              ready=true
              for dep in "${PKG_NAMES[@]}"; do
                if grep -q "^  $dep:" "$pkg/pubspec.yaml" && [ "${ORDERED[$dep]:-}" != true ]; then
                  ready=false
                  break
                fi
              done
              if [ "$ready" = true ]; then
                PUBLISH_ORDER+=("$pkg")
                ORDERED[$name]=true
                progress=true
              fi
            done
            if [ "$progress" = false ]; then
              echo "::error::Internal package dependencies contain a cycle"
              exit 1
            fi
          done

          echo "Publish order:"
          for pkg in "${PUBLISH_ORDER[@]}"; do
            echo "  $pkg"
          done

          for pkg in "${PUBLISH_ORDER[@]}"; do
            echo "::group::Publishing $pkg"
            PKG_NAME=$(basename "$pkg")
            PKG_VER=$(grep '^version:' "$pkg/pubspec.yaml" | awk '{print $2}')
            # Skip if this exact version is already published on pub.dev
            if curl -s -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/$PKG_NAME/versions/$PKG_VER" | grep -q '^200$'; then
              echo "::notice::$PKG_NAME $PKG_VER already published — skipping"
            else
              if ! (cd "$pkg" && dart pub publish --force); then
                echo "::error::$pkg publish failed"
                exit 1
              fi
              # Wait between publishes to avoid pub.dev rate limits
              echo "Waiting 30s before next publish..."
              sleep 30
            fi
            echo "::endgroup::"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
